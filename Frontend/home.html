<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Assets/css/utility.css">
    <link rel="stylesheet" href="Assets/css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


    <title>HMI Dashboard</title>
</head>

<body>
    <div class="main-container">
        <div class="container">
            <div class="flex-item map-container">
                <div class="flex-item map">
                    <!-- <img src="Assets/images/GPS-image.png" alt="Map for Navigation"> -->
                    <div id="map" style="height: 100%;"></div>
                </div>
                <div class="flex-item map-details">
                    <div class="data-con">
                        <p class="destination">225 Highway 8 North road Felton, CA</p>
                        <div class="button-grp">
                            <div class="kilometer">
                                <i class="bi bi-speedometer"></i>
                                <p>141.45 km</p>
                            </div>
                            <div class="time">
                                <i class="bi bi-alarm"></i>
                                <p>20:26:54</p>
                            </div>
                        </div>
                    </div>
                    <a class="button dir-button" href="#">Start</a>
                </div>
            </div>
            <div class="flex-item details-container">
                <div class="cont-header">
                    <div class="yaw-rate">
                        <p>YAW RATE</p>
                        <p class="value">2.4</p>
                    </div>

                    <div class="lateral-acc">
                        <p>LATERAL ACC</p>
                        <p class="value">43</p>
                    </div>

                    <div class="longi-acc">
                        <p>LONGITUDINAL ACC</p>
                        <p class="value">32</p>
                    </div>
                </div>

                <div class="steering-wheel">
                    <div class="speedo">
                        <p>85</p>
                        <p>km/h</p>
                    </div>

                    <div class="steering-wheel-angle">
                        <p>-2</p>
                        <p>DEG</p>
                    </div>
                    <img src="Assets/images/Steering.png" alt="">
                </div>

                <div class="cont-GPS">
                    <div class="GPS-lat">
                        <p>LATITUDE DEGREE</p>
                        <p class="value">79.850290193</p>
                    </div>
                    <div class="GPS-long">
                        <p>LONGITUDE DEGREE</p>
                        <p class="value">78.939490954</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

    function test(cord){
        var polyline = L.polyline(cord, { color: 'red' }).addTo(map);

</html>
