<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="Assets/css/utility.css">
    <link rel="stylesheet" href="Assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>HMI Dashboard</title>
</head>
<body>
    <div class="main-container">
        <div class="container">
            <div class="flex-item map-container">
                <div class="flex-item map">
                    <img src="Assets/images/GPS-image.png" alt="Map for Navigation">
                </div>
                <div class="flex-item map-details">
                    <div class="data-con">
                        <p class="destination">225 Highway 8 North road Felton, CA</p>
                        <div class="button-grp">
                            <div class="kilometer">
                                <i class="bi bi-speedometer"></i>
                                <p>141.45 km</p>
                            </div>
                            <div class="time">
                                <i class="bi bi-alarm"></i>
                                <p>20:26:54</p>
                            </div>
                        </div>
                    </div>
                        <a class="button dir-button" href="#">Start</a>
                </div>
            </div>
            <div class="flex-item details-container">
                <div class="cont-header"></div>
                <div class="cont-details"></div>
                <div class="cont-battery"></div>
                <div class="cont-drivingmode"></div>
            </div>
            <div class="flex-item steering-container">
                <div class="header-container"></div>
                <div class="steering"></div>
                <div class="option-container"></div>
            </div>
        </div>
    </div>
</body>
</html>
