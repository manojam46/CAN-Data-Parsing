<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Assets/css/utility.css">
    <link rel="stylesheet" href="Assets/css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Lugrasimo&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>


    <title>HMI Dashboard</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            color: white;
            background-color: transparent;
        }

        a {
            text-decoration: none;
            color: white;
        }

        .button {
            background-color: white;
            padding: 0.75rem 2.75rem;
            font-size: 1.5rem;
            margin: 1.5rem;
            border-radius: 30px;
            color: black;
            box-shadow: 2px
        }

        .button:hover {
            background-color: black;
            color: white;
            border: 2px solid white;
        }

        .main-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
        }

        .container {
            display: flex;
            flex-direction: row;
            border-radius: 20px;
            height: 90vh;
            width: 90vw;
            align-items: center;
            justify-content: center;
            padding-top: 1.25rem;
            padding-bottom: 1.25rem;
        }

        .container .flex-item {
            height: 100%;
            width: 100%;
            margin: 1rem;
            padding: 1rem;
            border-radius: 30px;
        }

        .container .map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container .map-container .map {
            height: 900%;
            padding: 0
        }

        .container .map-container .map img {
            height: 100%;
            width: 100%;
        }

        .container .map-container .map-details {
            display: flex;
            flex-direction: row;
            /* margin: 1.25rem;
            padding: 1.25rem; */
            align-items: center;
            justify-content: flex-start;
            border: 3px rgb(104, 103, 103) solid;
            background-color: rgba(128, 128, 128, 0.5);
        }

        .container .map-container .map-details .data-con .destination {
            font-size: 1.25rem;
            background: none;
        }

        .container .map-container .map-details a {
            margin-top: 1rem;
            font-size: 1.05rem;
        }

        .container .map-container .map-details .data-con .button-grp {
            display: flex;
            flex-direction: row;
            gap: 3rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.5rem 0.5rem 0;
        }

        .container .map-container .map-details .data-con .button-grp .kilometer,
        .container .map-container .map-details .data-con .button-grp .time {
            display: flex;
            flex-direction: row;
            gap: 0;
        }

        .container .map-container .map-details .data-con .button-grp .kilometer i,
        .container .map-container .map-details .data-con .button-grp .time i {
            font-size: 1.5rem;
            padding-right: 0.5rem;
        }

        .container .map-container .map-details .data-con .button-grp .kilometer p,
        .container .map-container .map-details .data-con .button-grp .time p {
            align-self: center;
            justify-self: center;
            font-size: 1.1rem;
        }

        .container .details-container {
            display: flex;
            flex-direction: column;
            font-family: 'Seven Segment', sans-serif;
            width: 35%;
        }

        .container .details-container .cont-header,
        .container .details-container .cont-GPS {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 10%;
            align-items: center;
            justify-content: space-around;
            background-color: rgba(133, 132, 132, 0.5);
            border-radius: 30px;
            font-size: 1.5rem;
            text-align: center;
            margin: 1.25rem;
            padding: 1.25rem
        }

        .container .details-container .steering-wheel {
            margin: auto;
            position: relative;
        }

        .container .details-container .steering-wheel .speedo {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            text-align: center
        }

        .container .details-container .steering-wheel .steering-wheel-angle {
            position: absolute;
            top: 44%;
            left: 46%;
            text-align: center;
            font-size: 1.75rem;
            z-index: 4;
        }

        .container .curve-container{
            width: 75%;
            height: 70%;
            /* border: 2px solid white; */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container .curve-container h1.greet{
            margin: 2.75rem 0;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            font-family: "Lugrasimo", cursive;
        }

        .container .curve-container img{
            width: 100%;
        }

        .container .curve-container .arrows{
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.75rem;
            padding: 0.75rem;
        }

        .container .curve-container .arrows i{
            font-size: 7rem;
            padding: 1rem;
        }

        .container .curve-container .alert{
            font-family: "Kode Mono", monospace;
            font-size: 2.25rem;
        }

        .container .curve-container .prev-speed{
            font-family: 'Seven Segment', sans-serif;
            margin: 1.75rem;
            font-size: 1.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container .curve-container .prev-speed p{
            font-size: 3rem;
        }




    </style>
</head>

                <div class="cont-GPS">
                    <div class="GPS-lat">
                        <p>LATITUDE DEGREE</p>
                        <p class="value" id="lat">--</p>
                    </div>
                    <div class="GPS-long">

                        <p class="value" id="long">--</p>
                    </div>
                </div>

<script>
    var speed = document.getElementById("speed"),
    steerAngl = document.getElementById("steerAngl"),
    long = document.getElementById("long"),
    lat = document.getElementById("lat"),
    steer = document.getElementById("steer"),
    yaw = document.getElementById("yaw"),
    latAccel = document.getElementById("latAccel"),
    longAccel = document.getElementById("longAccel"),
    time = document.getElementById("time"),
    speed2 = document.getElementById("speed2");

    let connectionPort;
    let coordinates = [];

    var prevGPS = [0.1, 0.1].toString();

    function serializeData(newData, oldData){
        return (newData === "...")? oldData : newData;
    }

    function mapGPSCoordinates(lat, long) {
        if([lat, long].toString() === prevGPS || lat <= 1 || long <= 1){
            return;
        }

        coordinates.push([lat, long]);

        var polyline = L.polyline(coordinates, { color: 'red' }).addTo(map);
        map.fitBounds(polyline.getBounds());
        prevGPS = [lat, long].toString();
    }

    window.onload = () => {
        map = L.map('map').setView([0, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);


        try{
            connectionPort = ( 64597 || prompt("Enter the PORT no to connect!") );
            var ws = new WebSocket("ws://localhost:" + connectionPort);

            ws.onerror = function(event){
                alert("Connection failed! Trying to reconnect!");
                ws = new WebSocket("ws://localhost:" + connectionPort);
            }

            document.getElementById("startStop").addEventListener("click", () => {
                coordinates = []
                ws.send("START_SIM")
            });

            ws.onmessage = function(event){
                const data = event.data;

                if(!data){
                    return;
                }

                const processedData = data.split('~');
                processedData[2] = parseFloat(serializeData(processedData[2], steerAngl.innerText));

                // | Current Time | Vehicle Speed | SteerAngle | YawRate | LatAccel | LongAccel | GPS Lat/Long        |

                time.innerText = `${(parseFloat(processedData[0]) / 1000).toFixed(1)}s`;

                speed.innerText = speed2.innerText = serializeData(processedData[1], speed2.innerText)

                steerAngl.innerText = processedData[2];

                if(processedData[2] !== "..."){
                    steer.style.transform = `rotate(${processedData[2]}deg)`;
                }

                yaw.innerText = serializeData(processedData[3], yaw.innerText)

                latAccel.innerText = serializeData(processedData[4], latAccel.innerText)

                longAccel.innerText = serializeData(processedData[5], longAccel.innerText)

                processedData[6] = parseFloat(serializeData(processedData[6], lat.innerText))

                processedData[7] = parseFloat(serializeData(processedData[7], long.innerText))

                lat.innerText = processedData[6]

                long.innerText = processedData[7]

                mapGPSCoordinates(processedData[6], processedData[7])
            }
        } catch (err) {
            alert("Failed to connect");
        }
    };




</script>
